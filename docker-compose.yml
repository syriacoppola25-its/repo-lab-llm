services:
  assistente:
    build: .
    # Modello e variabili facoltative arrivano da .env (vedi .env.example).
    env_file: .env
    environment:
      # Nel container "localhost" è il container stesso: LM Studio è sull'host.
      LMSTUDIO_URL: "http://host.docker.internal:1234/v1"
      PERCORSO_LOG: "/app/logs/assistente.log"
    stdin_open: true
    tty: true
    volumes:
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
